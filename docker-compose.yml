# Production stack for Ubuntu Server. Needs a .env file beside this one: see DOCKER.md.
name: ars

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  WEB_URL: https://${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
  DATABASE_URL: postgres://${DB_USER:-ars}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-ars}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  STORAGE_DIR: ./storage
  # Only the seed service receives this.
  SEED_PASSWORD: ""

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ars}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-ars}
      # ARS requires UTF8: other encodings reject Bangla text.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      # PostgreSQL 18 images keep their data under this folder, not .../data.
      - db_data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  # Applies pending migrations, then exits. Runs before the API on every start.
  migrate:
    image: ars-api:latest
    pull_policy: never
    command: ["node", "node_modules/typeorm/cli.js", "-d", "dist/database/data-source.js", "migration:run"]
    env_file: .env
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    restart: "no"
    healthcheck:
      disable: true
    logging: *logging

  # First install only: docker compose run --rm seed
  seed:
    image: ars-api:latest
    pull_policy: never
    profiles: [tools]
    command: ["node", "dist/database/seed.js"]
    env_file: .env
    environment:
      <<: *api-env
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    restart: "no"
    healthcheck:
      disable: true

  api:
    image: ars-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    env_file: .env
    environment: *api-env
    volumes:
      - api_storage:/app/backend/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, app]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  web:
    image: ars-web:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks: [app, edge]
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # The only public entry point. The login cookie is HTTPS-only in production, so ARS must be served over HTTPS.
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  db_data:
  api_storage:
  caddy_data:
  caddy_config:

networks:
  # Database traffic only, with no internet access.
  data:
    internal: true
  # Web to API. The API also sends email from here.
  app:
  # Caddy to web.
  edge:
